---
version: "3.9"
services:
    ultrasinger:
        runtime: nvidia
        environment:
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: compute,utility
        stdin_open: true
        tty: true
        container_name: UltraSinger 
        volumes:
            -  ./output:/app/UltraSinger/src/output
        image: rakuri255/ultrasinger:latest
