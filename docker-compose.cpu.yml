# UltraSinger Web UI (CPU only — no NVIDIA GPU).
# Pulls the published image (no local build):
#   docker compose -f docker-compose.cpu.yml pull
#   docker compose -f docker-compose.cpu.yml up
# Then open http://localhost:8756
#
# Local build: docker compose -f docker-compose.cpu.yml -f docker-compose.build.yml up --build

services:
  webui:
    image: ${WEBUI_IMAGE:-ghcr.io/binarygeek119/ultrasinger-with-webui:latest}
    pull_policy: always
    container_name: UltraSinger-WebUI
    init: true
    restart: unless-stopped
    working_dir: /app/UltraSinger
    command: ["python3.12", "-m", "webui"]
    ports:
      - "${WEBUI_PORT:-8756}:8756"
    environment:
      HOME: /app/UltraSinger
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/UltraSinger
      WEBUI_NO_BROWSER: "1"
      ULTRASINGER_WEBUI_HOST: "0.0.0.0"
      ULTRASINGER_WEBUI_PORT: "8756"
      ULTRASINGER_WEBUI_TRAY: "0"
      ULTRASINGER_WEBUI_FORCE_CPU: "1"
      ULTRASINGER_YARG_EXPORT_PATH: /export/yarg
      ULTRASINGER_ULTRASTAR_EXPORT_PATH: /export/ultrastar
    volumes:
      - ./data:/app/UltraSinger/data
      - ./export/yarg:/export/yarg
      - ./export/ultrastar:/export/ultrastar
      - webui-cache:/app/UltraSinger/.cache
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8756/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  webui-cache:
